 name: Keep Supabase Alive

 on:
   schedule:
     # 매일 UTC 00:00에 실행 (7일 내 제한 내에 충분히 안전)
     - cron: '0 0 * * *'
   workflow_dispatch:  # 수동 트리거를 허용 (테스트용)

 jobs:
   ping:
     runs-on: ubuntu-latest
     steps:
       - name: Ping Supabase Database
         run: |
           curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/week?select=id&limit=1" \
             -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
             -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
